  <line x1="42" y1="52" x2="25" y2="62" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="43" x2="75" y2="35" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="47" x2="78" y2="47" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
